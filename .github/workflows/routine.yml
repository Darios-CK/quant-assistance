name: Tägliche Berichte

on:
  schedule:
    - cron: "30 5 * * 1-5"      # Mo–Fr 05:30 UTC (06:30/07:30 deutsche Zeit)
  workflow_dispatch:             # zusätzlich per Knopf unter "Actions" startbar

permissions:
  contents: write                # the job commits reports/auto back to the repository

concurrency:
  group: routine
  cancel-in-progress: false

jobs:
  routine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Kurs-Zwischenspeicher wiederherstellen
        uses: actions/cache@v6
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Tests
        run: python -m pytest -q

      - name: Berichte rechnen
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m qa routine

      - name: Berichte speichern
        run: |
          git config user.name "quant-analyst-bot"
          git config user.email "quant-analyst-bot@users.noreply.github.com"
          git add reports/auto
          git diff --cached --quiet || git commit -m "Daily reports $(date -u +%Y-%m-%d)"
          git push
