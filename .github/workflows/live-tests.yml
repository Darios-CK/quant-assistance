name: Live-Tests (echte Daten)

on:
  schedule:
    - cron: "0 6 * * 0"        # Sundays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Live tests
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m pytest -m live -v -p no:cacheprovider | tee live-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-tests
          path: live-tests.txt
