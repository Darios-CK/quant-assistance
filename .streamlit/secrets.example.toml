# Copy to .streamlit/secrets.toml (local, not in Git) – or paste into Streamlit Cloud → App settings → Secrets.

# Personal area of the public website (Projekte, Copilot, Konto). Without it these pages stay locked online.
APP_PASSWORD = ""

# Lasting storage for projects, chats, memory: a PRIVATE GitHub repository + fine-grained token (Contents: read and write).
# COMMUNITY_REPO: where "Veröffentlichen" writes (folder community/). Leave both empty to keep files on the server only.
GITHUB_TOKEN = ""
WORKSPACE_REPO = ""           # e.g. "Darios-CK/quant-assistance-daten"
COMMUNITY_REPO = ""           # e.g. "Darios-CK/quant-assistance"

FRED_API_KEY = ""

# Optional, costs money per question: free-text answers on the website (Claude API). Free alternative: Claude Code + MCP.
ANTHROPIC_API_KEY = ""

[impressum]
name = ""          # full name, e.g. "Max Muster"
street = ""        # street and number – a P.O. box is not enough
city = ""          # postcode and town, e.g. "10115 Berlin"
country = "Deutschland"
email = ""
phone = ""         # optional

[privacy]
supervisory_authority = ""   # data protection authority of your federal state
